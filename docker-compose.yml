services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ofplens
      POSTGRES_PASSWORD: ofplens
      POSTGRES_DB: ofplens
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ofplens -d ofplens']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
