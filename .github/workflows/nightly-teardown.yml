name: Nightly teardown

# Destroys the AWS cluster (infra/aws) every night, in case it was left running: the same
# `pnpm aws:down` you run by hand. Keeps infra/bootstrap. infra/aws/README.md explains how to
# keep the cluster for a night, and how to run this by hand (Actions → Nightly teardown → Run).
on:
  schedule:
    # 01:23 UTC: 02:23 in Germany in winter, 03:23 in summer. GitHub starts scheduled runs late,
    # often by hours (around 09:30 UTC in November 2026); an odd minute avoids the busiest slot.
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Lets the job ask GitHub for an OIDC token, which AWS exchanges for the teardown role.
  id-token: write

# Never two teardowns at once (Terraform's state lock would stop the second anyway).
concurrency:
  group: aws-cluster
  cancel-in-progress: false

jobs:
  teardown:
    name: Destroy infra/aws
    # Repository variable KEEP_CLUSTER=true skips it (Settings → Secrets and variables → Actions).
    if: vars.KEEP_CLUSTER != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # No stored keys: GitHub's OIDC token is exchanged for the role from infra/bootstrap,
      # which trusts only workflows on main of this repository. The role ARN is a secret so the
      # account id stays out of this public repository's logs.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_TEARDOWN_ROLE_ARN }}
          role-session-name: nightly-teardown
          aws-region: eu-central-1
          mask-aws-account-id: true

      # Because GitHub may start this in the morning, it could stop a session that just began
      # (it did on 2026-11-27, OFP-60). A cluster younger than MIN_AGE_HOURS is a session going
      # on, not a forgotten one: skip it tonight; it is checked again tomorrow. Runs started by
      # hand always tear down.
      - name: Is a session going on?
        id: session
        if: github.event_name == 'schedule'
        env:
          MIN_AGE_HOURS: 4
        run: |
          created=$(aws eks describe-cluster --name ofplens --query cluster.createdAt --output text 2>/dev/null || true)
          if [[ -z "$created" ]]; then
            echo "No cluster; tearing down anyway, in case something else was left."
            exit 0
          fi
          age=$(( ($(date -u +%s) - $(date -u -d "$created" +%s)) / 3600 ))
          echo "The cluster was created $created, ${age} h ago."
          if (( age < MIN_AGE_HOURS )); then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipped: the cluster is ${age} h old (under ${MIN_AGE_HOURS} h), so a session is likely going on. Run this workflow by hand to tear it down anyway." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: hashicorp/setup-terraform@v4
        if: steps.session.outputs.skip != 'true'
        with:
          terraform_version: ~1.17.0
          # The wrapper rewrites terraform's output; the script reads it plainly.
          terraform_wrapper: false

      # kubectl and helm come with the runner image.
      - name: Tear down (deploy/aws/down.sh)
        if: steps.session.outputs.skip != 'true'
        run: deploy/aws/down.sh
        env:
          AUTO_APPROVE: '1'
