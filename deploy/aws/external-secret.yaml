# The app's Secret on AWS, made by External Secrets (installed by infra/aws). On kind, up.sh
# creates the same Secret with kubectl; here it is copied from Secrets Manager instead, so the
# values never pass through this repo, Terraform's plan output or your terminal.
#
# Not part of the Helm chart for the same reason as kind's postgres.yaml: it is how this
# platform provides the secret, and the chart only expects a Secret named ofplens-secrets.

# Where to read from. No credentials here: the External Secrets controller has an EKS Pod
# Identity that may read exactly these two secrets (infra/aws/addons.tf).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: ofplens
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
---
# What to copy: every key of both JSON secrets becomes a key of the Secret ofplens-secrets.
#   ofplens/app       ANTHROPIC_API_KEY, GOOGLE_*, GITHUB_* (you paste them in the console)
#   ofplens/database  DATABASE_URL (written by Terraform when it creates the database)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ofplens-secrets
  namespace: ofplens
spec:
  # Checked again every hour. To pick up a change at once: infra/aws/README.md, "Add your keys".
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: ofplens-secrets
    # The Secret belongs to this ExternalSecret: deleting one deletes the other.
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ofplens/app
    - extract:
        key: ofplens/database
