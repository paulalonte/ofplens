# kind on your Mac (deploy/kind/up.sh): only what differs from values.yaml.
# Images are built locally and loaded into the nodes, so they are never pulled.
image:
  pullPolicy: Never

api:
  publicUrl: http://localhost:8088
  # No Google or GitHub app is registered for localhost:8088: sign in by name.
  devSignIn: true

web:
  replicas: 1

ingress:
  className: traefik
