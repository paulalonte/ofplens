apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ofplens.name" . }}-api
  labels:
    {{- include "ofplens.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "ofplens.selector" (list . "api") | nindent 6 }}
  strategy:
    # Start a new pod before stopping an old one: no moment without a running API.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "ofplens.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/api-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "ofplens.name" . }}
      securityContext:
        {{- include "ofplens.podSecurity" . | nindent 8 }}
      # Spread the replicas over nodes, so one machine failing leaves the others running.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "ofplens.selector" (list . "api") | nindent 14 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: {{ include "ofplens.image" (list . .Values.image.api) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: {{ include "ofplens.name" . }}-api
          env:
            {{- include "ofplens.secretEnv" . | nindent 12 }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: ANTHROPIC_API_KEY
                  optional: true
          # Ready = can serve: the API and its database answer. Not ready pods get no traffic.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Alive = the process answers at all. Deliberately not /api/health: a database outage
          # must not make Kubernetes restart every API pod (that would not fix the database).
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            # Keep serving a few seconds after being told to stop, while the load balancer and
            # the Service stop sending new requests here; then Node gets SIGTERM.
            preStop:
              sleep:
                seconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "ofplens.containerSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ofplens.name" . }}-api
  labels:
    {{- include "ofplens.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "ofplens.selector" (list . "api") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
