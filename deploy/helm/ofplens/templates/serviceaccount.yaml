# The pods' identity in the cluster. They never call the Kubernetes API, so no token is mounted.
# On AWS this is where an IAM role gets attached (IRSA), when the app needs AWS access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ofplens.name" . }}
  labels:
    {{- include "ofplens.labels" . | nindent 4 }}
automountServiceAccountToken: false
