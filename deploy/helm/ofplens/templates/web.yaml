apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ofplens.name" . }}-web
  labels:
    {{- include "ofplens.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "ofplens.selector" (list . "web") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "ofplens.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "ofplens.name" . }}
      securityContext:
        {{- include "ofplens.podSecurity" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "ofplens.selector" (list . "web") | nindent 14 }}
      containers:
        - name: web
          image: {{ include "ofplens.image" (list . .Values.image.web) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # nginx forwards /api here when it is reached directly (the Ingress sends /api to
            # the API Service itself).
            - name: API_UPSTREAM
              value: http://{{ include "ofplens.name" . }}-api:3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "ofplens.containerSecurity" . | nindent 12 }}
          # The root filesystem is read-only; nginx writes its config (from the template) and
          # temporary files to these two empty, per-pod folders.
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ofplens.name" . }}-web
  labels:
    {{- include "ofplens.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "ofplens.selector" (list . "web") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
